<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <h1>Calculator</h1>
    <div class="calculator">
        <div class="calculator-border">

            <div class="display-border">
                <input class="display" type="text" value="0" disabled />
            </div>

            <div class="buttons">
                <button class="button clear">AC</button>
                <button class="button operator">+/-</button>
                <button class="button percentage">%</button>
                <button class="button operator">/</button>

                <button class="button">7</button>
                <button class="button">8</button>
                <button class="button">9</button>
                <button class="button operator">*</button>

                <button class="button">4</button>
                <button class="button">5</button>
                <button class="button">6</button>
                <button class="button operator">-</button>

                <button class="button">1</button>
                <button class="button">2</button>
                <button class="button">3</button>
                <button class="button operator">+</button>

                <button class="button backspace">←</button>
                <button class="button">0</button>
                <button class="button decimal">.</button>
                <button class="button equals">=</button>
            </div>

        </div>

    </div>

    <script src="javascript.js"></script>
</body>

</html>
